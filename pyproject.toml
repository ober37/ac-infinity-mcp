[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ac-infinity-mcp"
version = "0.1.0"
description = "MCP server for AC Infinity grow environment control"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.14.1",
    "requests>=2.33.0",
    "tenacity>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "responses>=0.23",
    "ruff>=0.4",
    "mypy>=1.8",
    "types-requests",
    "pip-audit>=2.7",
]

[project.scripts]
ac-infinity-mcp = "ac_infinity_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
ignore_missing_imports = true
python_version = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Live tests are opt-in: contributors who want to exercise them against the
# real AC Infinity API must pass `-m live` explicitly. CI does not pass it,
# so even if AC_INFINITY_EMAIL leaked into the workflow env, the suite would
# still skip these tests (P3-F009).
addopts = "--cov=ac_infinity_mcp --cov-report=term-missing --cov-fail-under=85 -m 'not live'"
markers = [
    "live: tests that hit the real AC Infinity cloud API; opt-in via `-m live`",
]
