name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Lock down GITHUB_TOKEN to read-only — neither job needs write access to repo
# contents, issues, PRs, or anything else. Without this, the workflow inherits
# the repo's default GITHUB_TOKEN permissions (which under classic settings can
# be write-all) and a malicious fork PR could exfiltrate the token. P3-C2-F007.
permissions:
  contents: read

jobs:
  test:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint — ruff
        run: ruff check src/ tests/

      - name: Type check — mypy
        run: mypy src/ac_infinity_mcp/

      - name: Tests — pytest
        run: pytest tests/ -v
        env:
          AC_INFINITY_EMAIL: ""
          AC_INFINITY_PASSWORD: ""

      - name: Security audit — pip-audit
        # PYSEC-2025-183: upstream `mcp` CVE, stdio-only transport unaffected.
        # PYSEC-2026-161: starlette CVE (transitive via mcp), stdio-only transport
        #   means affected request-handling paths are never reached.
        # Rationale + re-evaluation dates in docs/SECURITY-RISKS.md.
        run: pip-audit --ignore-vuln PYSEC-2025-183 --ignore-vuln PYSEC-2026-161

  docker:
    name: "Docker build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Build image
        run: docker build -t ac-infinity-mcp-test .

      - name: Missing creds → clean exit
        run: |
          output=$(docker run --rm ac-infinity-mcp-test 2>&1) || true
          echo "$output"
          echo "$output" | grep -q "Missing AC_INFINITY_EMAIL" || (echo "FAIL: expected missing-creds error" && exit 1)

      - name: No .env baked into image
        run: |
          count=$(docker run --rm ac-infinity-mcp-test find / -name ".env" 2>/dev/null | wc -l)
          [ "$count" -eq 0 ] || (echo "FAIL: .env found in image" && exit 1)
